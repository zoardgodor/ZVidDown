<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZVidDown – Screenshots</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        header p {
            margin-top: 10px;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px;
            background: #020617;
        }

        nav a {
            background: none;
            border: 1px solid #2563eb;
            color: #e5e7eb;
            padding: 6px 12px;
            margin-left: 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        nav a:hover {
            background: #2563eb;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        section {
            margin-bottom: 50px;
        }

        h2 {
            color: #93c5fd;
            margin-bottom: 15px;
        }

        .screenshots {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .screenshots img {
            max-width: 100%;
            height: auto;
            border: 1px solid #374151;
            border-radius: 8px;
        }

        footer {
            background: #020617;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Back to Home</a>
</nav>

<header>
    <h1>ZVidDown</h1>
    <p>Screenshots</p>
</header>

<main>

    <section>
        <h2>Main Window</h2>
        <div class="screenshots">
            <img src="./main_window.png" alt="Main Window Screenshot">
        </div>
    </section>

    <section>
        <h2>Transformer (Converter)</h2>
        <div class="screenshots">
            <img src="./transformer.png" alt="Transformer Screenshot">
        </div>
    </section>

</main>

<footer>
    © ZVidDown – Created by Gódor Zoárd, developer of ZLockCore
</footer>

</body>
</html>
